name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          test -f README.md
          test -f RaceDay/RaceDay.sln
          test -f RaceDay/RaceDay.Api/RaceDay.Api.csproj
          test -f RaceDay/RaceDay.Mvc/RaceDay.Mvc.csproj
          test -f RaceDay/RaceDay.Mvc/Dockerfile
          test -f RaceDay/RaceDay.Tests/RaceDay.Tests.csproj

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        working-directory: RaceDay
        run: dotnet restore RaceDay.sln

      - name: Build API, MVC and tests
        working-directory: RaceDay
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Test
        working-directory: RaceDay
        run: dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build MVC Docker image
        working-directory: RaceDay
        run: docker build -f RaceDay.Mvc/Dockerfile -t raceday-mvc:ci .
